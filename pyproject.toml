[project]
name = "ai-security-log-anomaly"
version = "0.1.0"
description = "AI-assisted security log anomaly detection and investigation"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2.0,<3",
  "scikit-learn>=1.5,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
