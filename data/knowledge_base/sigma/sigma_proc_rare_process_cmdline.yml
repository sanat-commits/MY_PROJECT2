title: Execution of Suspicious Shell or Scripting Interpreter
id: 3f1a4e82-1205-4d2b-ba76-928ef1479c31
status: test
description: Detects process execution spawning common scripting interpreters (powershell.exe, cmd.exe, wscript.exe, cscript.exe) with suspicious flags or hidden windows.
references:
    - https://attack.mitre.org/techniques/T1059/
    - https://attack.mitre.org/techniques/T1059.001/
author: SigmaHQ (Adapted for AI Security Log Project)
date: 2024-03-01
tags:
    - attack.execution
    - attack.t1059
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        EventID: 4688
        NewProcessName|endswith:
            - '\powershell.exe'
            - '\cmd.exe'
            - '\wscript.exe'
            - '\cscript.exe'
    flags:
        CommandLine|contains:
            - '-ExecutionPolicy Bypass'
            - '-WindowStyle Hidden'
            - '-Enc'
            - '-EncodedCommand'
    condition: selection and flags
falsepositives:
    - Legitimate administrative automation scripts and system deployment tools
level: high
